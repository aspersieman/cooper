<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Bookmarks</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f4f4f4;
            }

            header {
                width: 100%;
                text-align: center;
                margin-top: 1rem;
            }

            .header-title {
                display: flex;
                align-items: center;
                font-size: 3rem;
                margin: auto;
                text-align: center;
                max-width: 16rem;
            }

            header .logo {
                width: 5rem;
            }

            main {
                max-width: 600px;
                margin: 0 auto;
                padding: 20px;
            }

            .main-actions {
                background-color: #c8c8c8;
                padding: 1rem;
                border-radius: 2px;
                margin-bottom: 1rem;
            }

            .main-action-button {
                display: flex;
                align-items: center;
                border-radius: 5px;
                padding: 0.5rem;
            }

            .bookmark-form {
                display: flex;
                margin-bottom: 10px;
            }

            input[type="url"] {
                flex: 1;
                padding: 10px;
            }

            button#addBookmark {
                background-color: #007bff;
                color: #fff;
                border: none;
                cursor: pointer;
                font-weight: 600;
                margin-left: 6px;
            }

            button#addBookmark:hover {
                background-color: #160af3;
            }

            button#deleteAll {
                background-color: #ff6347;
                color: #fff;
                border: none;
                padding: 10px 20px;
                cursor: pointer;
                margin-left: 10px;
                font-weight: 600;
            }

            button#deleteAll:hover {
                background-color: #f80404;
            }

            .bookmark-item {
                background-color: #f5f5f5;
                padding: 10px;
                border: 2px solid #1d22b3;
                border-radius: 5px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 10px;
                background-color: #e6f2f5;

                animation: show 600ms 100ms cubic-bezier(0.38, 0.97, 0.56, 0.76) forwards;

                opacity: 0;
                transform: rotateX(-90deg);
                transform-origin: top center;
            }

            @keyframes show {
                100% {
                    opacity: 1;
                    transform: none;
                }
            }

            .bookmark-item a {
                text-decoration: none;
                color: #0d0d0d;
            }

            .bookmark-item a:hover {
                text-decoration: underline;
            }

            .bookmark-details {
                display: flex;
                flex-direction: column;
            }

            .bookmark-details-link {
                display: flex;
            }

            .bookmark-title {
                font-size: 0.9rem;
                margin-left: 1.5rem;
            }

            .icon-button {
                display: flex;
                margin: 0.3rem;
                border-radius: 5px;
                padding: 0.3rem;
            }

            .delete {
                background-color: #ff6347;
                color: #fff;
                border: none;
                font-size: medium;
                cursor: pointer;
            }

            .delete:hover {
                background-color: #f80404;
            }

            .edit {
                background-color: #6947ff;
                color: #fff;
                border: none;
                font-size: medium;
                cursor: pointer;
            }

            .edit:hover {
                background-color: #4b0da3;
            }

            ul {
                list-style: none;
                padding: 0;
            }

            li {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 10px;
            }

            .bookmark-link {
                font-weight: bold;
                text-overflow: ellipsis;
                overflow: hidden;
                white-space: nowrap;
                max-width: 20rem;
            }

            .buttons {
                display: flex;
            }

            a {
                text-decoration: none;
                color: #333;
            }

            a:hover {
                text-decoration: underline;
                color: rgb(40, 130, 189);
            }

            .clock {
                position: fixed;
                bottom: 0;
                right: 0;
                font-size: 0.8rem;
                font-family: Orbitron;
                letter-spacing: 2px;
            }

            @media (max-width: 768px) {
                main {
                    padding: 10px;
                }

                .bookmark-form {
                    flex-direction: column;
                }

                input[type="url"],
                button#addBookmark,
                button#deleteAll {
                    margin-left: 0;
                    margin-bottom: 10px;
                }
            }

            @media (max-width: 345px) {
                main {
                    padding: 10px;
                }

                .bookmark-form {
                    flex-direction: column;
                }

                input[type="url"],
                button#addBookmark,
                button#deleteAll {
                    margin-left: 0;
                }
            }

            /* hamburger menu */
            #menuToggle
            {
                display: block;
                position: fixed;
                top: 50px;
                left: 50px;

                z-index: 1;

                -webkit-user-select: none;
                user-select: none;
            }

            #menuToggle a
            {
                text-decoration: none;
                color: #232323;

                transition: color 0.3s ease;
            }

            #menuToggle a:hover
            {
                color: tomato;
            }


            #menuToggle input
            {
                display: block;
                width: 40px;
                height: 32px;
                position: absolute;
                top: -7px;
                left: -5px;

                cursor: pointer;

                opacity: 0;
                z-index: 2;

                -webkit-touch-callout: none;
            }

            #menuToggle span
            {
                display: block;
                width: 33px;
                height: 4px;
                margin-bottom: 5px;
                position: relative;

                background: #cdcdcd;
                border-radius: 3px;

                z-index: 1;

                transform-origin: 4px 0px;

                transition: transform 0.5s cubic-bezier(0.77,0.2,0.05,1.0),
                    background 0.5s cubic-bezier(0.77,0.2,0.05,1.0),
                    opacity 0.55s ease;
            }

            #menuToggle span:first-child
            {
                transform-origin: 0% 0%;
            }

            #menuToggle span:nth-last-child(2)
            {
                transform-origin: 0% 100%;
            }

            #menuToggle input:checked ~ span
            {
                opacity: 1;
                transform: rotate(45deg) translate(-2px, -1px);
                background: #232323;
            }

            #menuToggle input:checked ~ span:nth-last-child(3)
            {
                opacity: 0;
                transform: rotate(0deg) scale(0.2, 0.2);
            }

            #menuToggle input:checked ~ span:nth-last-child(2)
            {
                transform: rotate(-45deg) translate(0, -1px);
            }

            #menu
            {
                position: absolute;
                max-width: 400px;
                width: 100vw;
                max-height: 100vh;
                margin: -100px 0 0 -50px;
                padding: 50px;
                padding-top: 125px;
                box-sizing: border-box;
                overflow-y: auto;
                background: #ededed;
                list-style-type: none;
                -webkit-font-smoothing: antialiased;
                /* to stop flickering of text in safari */

                transform-origin: 0% 0%;
                transform: translate(-100%, 0);

                transition: transform 0.5s cubic-bezier(0.77,0.2,0.05,1.0);
                box-shadow: rgba(0, 0, 0, 0.07) 0px 1px 1px, rgba(0, 0, 0, 0.07) 0px 2px 2px, rgba(0, 0, 0, 0.07) 0px 4px 4px, rgba(0, 0, 0, 0.07) 0px 8px 8px, rgba(0, 0, 0, 0.07) 0px 16px 16px;
            }

            #menu li
            {
                padding: 10px 0;
                font-size: 22px;
            }

            #menu li label
            {
                cursor: pointer;
            }

            #menuToggle input:checked ~ ul
            {
                transform: none;
            }
            /* hamburger menu */
        </style>
    </head>
    <body>
        <nav role="navigation">
          <div id="menuToggle">
            <input type="checkbox" id="menuCheckbox" />
            <span></span>
            <span></span>
            <span></span>
            <ul id="menu">
              <li>
                <a href="#">
                  <label for="menuCheckbox" onclick="this.parentNode.click();">Home</label>
                </a>
              </li>
              <li>
                <a href="#about">
                  <label for="menuCheckbox" onclick="this.parentNode.click();">About</label>
                </a>
              </li>
              <li><label for="menuCheckbox"><a>Info</a></label></li>
              <li><label for="menuCheckbox"><a>Contact</a></label></li>
              <li>
                <a href="https://erikterwan.com/" target="_blank">Show me more</a>
              </li>
            </ul>
          </div>
        </nav>
        <header>
            <h1 class="header-title">
                <img class="logo" src="logo.png" />
                Cooper
            </h1>
            <h3>The Home Page for your Browser</h3>
        </header>
        <main>
            <section class="main-actions">
                <button class="main-action-button" id="deleteAll">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24">
                      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 7h14m-9 3v8m4-8v8M10 3h4a1 1 0 0 1 1 1v3H9V4a1 1 0 0 1 1-1ZM6 7h12v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7Z"/>
                    </svg>
                    Delete All
                </button>
            </section>
            <section class="bookmark-form">
                <input type="url" 
                       name="url" 
                       id="urlInput" 
                       placeholder="Enter URL" 
                       pattern="https://.*" 
                       size="50" 
                       required>
                <button class="main-action-button" id="addBookmark">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M7.833 2c-.507 0-.98.216-1.318.576A1.92 1.92 0 0 0 6 3.89V21a1 1 0 0 0 1.625.78L12 18.28l4.375 3.5A1 1 0 0 0 18 21V3.889c0-.481-.178-.954-.515-1.313A1.808 1.808 0 0 0 16.167 2H7.833Z"/>
                    </svg>
                    Add Bookmark
                </button>
            </section>
            <section class="bookmarks">
                <ul id="bookmarkList">
                </ul>
            </section>
        </main>
        <div id="clock" class="clock" onload="showTime()"></div>
        <script>
            const urlInput = 
                document.getElementById("urlInput");
            const addBookmarkButton =
                document.getElementById("addBookmark");
            const deleteAllButton = 
                document.getElementById("deleteAll");

            function uuidv4() {
                return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
                    (+c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> +c / 4).toString(16)
                );
            }

            class Store {
                constructor(name) {
                    this.name = name;
                    if (localStorage.getItem(this.name) === null) localStorage.setItem(this.name, JSON.stringify([]));
                }

                validate(item) {
                    return typeof item === 'object' && item !== null;
                }

                genId() {
                    return uuidv4();
                }

                create(item) {
                    if (this.validate(item)) {
                        const allItems = this.allRaw();
                        item.id = this.genId();
                        allItems.push(item);
                        localStorage.setItem(this.name, JSON.stringify(allItems));
                        return item;
                    } else {
                        throw new Error(`Error: store item '${this.name}' is not an object`);
                    }
                }

                delete(item) {
                    if (this.validate(item)) {
                        let allItems = this.allRaw();
                        allItems = allItems.filter((i) => {
                            return i.id != item.id
                        })
                        localStorage.setItem(this.name, JSON.stringify(allItems));
                    }
                }

                update(item) {
                    if (this.validate(item)) {
                        let allItems = this.allRaw();
                        const index = allItems.map((i) => i.id).indexOf(item.id)
                        allItems[index] = item;
                        localStorage.setItem(this.name, JSON.stringify(allItems));
                    }
                }

                allRaw() {
                    return JSON.parse(localStorage.getItem(this.name));
                }
            }

            class BookmarkStore extends Store {
                constructor() {
                    super("bookmarks");
                }

                getBookmarkByUrl(url) {
                    const bookmarks = this.allRaw();
                    const bookmark = bookmarks.find((bm) => {
                        return bm.url == url;
                    })
                    return bookmark;
                }

                getAll() {
                    let bookmarks = this.allRaw();
                    bookmarks = bookmarks.sort((a, b) => {
                        if (a.title < b.title) return -1
                        else return 1
                        return 0
                    })
                    return bookmarks.map((bm) => {
                        return new Bookmark(bm.id, bm.url, bm.title);
                    })
                }
            }

            class Schema {
                toObject() {
                    const obj = {};
                    Object.getOwnPropertyNames(this).forEach((val) => {
                        obj[val] = this[val];
                    });
                    return obj;
                }
                toString() {
                    return JSON.stringify(this.toObject());
                }
            }

            class Bookmark extends Schema {
                constructor(id, url, title) {
                    super();
                    this.id = id;
                    this.url = url;
                    this.title = title;
                }

                isValidURL() {
                    let isValid = false;
                    try {
                        new URL(this.url);
                        isValid = true;
                    } catch (err) {
                        console.error("Error: URL invalid: ", err);
                        isValid = false;
                    }
                    return isValid;
                }

                cleanUrl() {
                    return this.url.replace(/[^A-Za-z0-9]/g, '')
                }

                validate() {
                    return this.isValidURL();
                }
            }

            class View {
                draw() { }
                remove() { }
                update() { }
            }

            class BookmarkView extends View {
                constructor() {
                    super();
                    this.target = 
                        document.getElementById("bookmarkList");
                    this.store = new BookmarkStore();
                }

                clear() {
                    while (this.target.firstChild) {
                        this.target.removeChild(this.target.firstChild)
                    }
                }

                listenerEdit(el) {
                    const editButton = el.querySelector(".edit");
                    const bookmarkLink = el.querySelector("a");
                    const bookmarkTitle = el.querySelector(".bookmark-title");

                    editButton.addEventListener(
                        "click", () => {
                            const href = bookmarkLink.getAttribute("href");
                            const bookmark = this.store.getBookmarkByUrl(href);
                            const newTitle = prompt("Edit the Title:",
                                bookmark.title);
                            bookmark.title = newTitle;
                            const bm = new Bookmark(bookmark.id, bookmark.url, bookmark.title);

                            if (href && bm.isValidURL(href)) {
                                this.store.update(bookmark);
                                bookmarkLink.setAttribute("href", href);
                                bookmarkLink.innerHTML = href;
                                bookmarkTitle.innerHTML = newTitle;
                            } else if (href) {
                                alert(
                                    "Please enter a valid URL (http:// or https://)."
                                );
                            }
                        });
                }

                listenerDelete(el) {
                    const deleteButton = el.querySelector(".delete");
                    deleteButton.addEventListener("click", () => {
                        el.remove();
                        const bookmarkLink = el.querySelector(".bookmark-link");
                        const href = bookmarkLink.getAttribute("href");
                        const bookmark = this.store.getBookmarkByUrl(href);
                        this.store.delete(bookmark)
                    });
                }

                draw(bookmark) {
                    if (bookmark.isValidURL()) {
                        const bookmarkElement = document.createElement("li");
                        bookmarkElement.id = bookmark.id;
                        bookmarkElement.classList.add("bookmark-item");
                        bookmarkElement.innerHTML = 
                        `
                        <div class="bookmark-details">
                            <span class="bookmark-details-link">
                                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                                  <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.213 9.787a3.391 3.391 0 0 0-4.795 0l-3.425 3.426a3.39 3.39 0 0 0 4.795 4.794l.321-.304m-.321-4.49a3.39 3.39 0 0 0 4.795 0l3.424-3.426a3.39 3.39 0 0 0-4.794-4.795l-1.028.961"/>
                                </svg>
                                <a class="bookmark-link" href="${bookmark.url}" target="_blank">
                                    ${bookmark.url}
                                </a>
                            </span>
                            <div class="bookmark-title">${bookmark.title}</div>
                        </div>
                        <div class="buttons"> 
                            <button class="edit icon-button">
                                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m14.304 4.844 2.852 2.852M7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-4.5m2.409-9.91a2.017 2.017 0 0 1 0 2.853l-6.844 6.844L8 14l.713-3.565 6.844-6.844a2.015 2.015 0 0 1 2.852 0Z"/>
                                </svg>
                            </button>
                            <button class="delete icon-button">
                                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 7h14m-9 3v8m4-8v8M10 3h4a1 1 0 0 1 1 1v3H9V4a1 1 0 0 1 1-1ZM6 7h12v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7Z"/>
                                </svg>
                            </button>
                        </div>`;
                        this.target.appendChild(bookmarkElement);
                        urlInput.value = "";

                        this.listenerEdit(bookmarkElement);
                        this.listenerDelete(bookmarkElement);
                    } else {
                        alert(
                            "Please enter a valid URL (http:// or https://)."
                        );
                    }
                }
            }

            class Controller {
                index() {}
                create() {}
                show() {}
                edit() {}
                update() {}
                destroy() {}
            }

            class BookmarkController extends Controller {
                constructor() {
                    super()
                    this.store = new BookmarkStore();
                }
                index() {
                    const view = new BookmarkView() 
                    view.clear();
                    const bookmarks = this.store.getAll();
                    bookmarks.forEach((bookmark) => {
                        view.draw(bookmark);
                    });
                }

                deleteAll() {
                    const bookmarks = this.store.allRaw();
                    bookmarks.forEach((bookmark) => {
                        this.store.delete(bookmark);
                    });
                    const view = new BookmarkView() 
                    view.clear();
                }
            }

            function showTime(){
                var date = new Date();
                var h = date.getHours(); // 0 - 23
                var m = date.getMinutes(); // 0 - 59
                var s = date.getSeconds(); // 0 - 59
                var session = "AM";

                if(h == 0){
                    h = 12;
                }

                if(h > 12){
                    h = h - 12;
                    session = "PM";
                }

                h = (h < 10) ? "0" + h : h;
                m = (m < 10) ? "0" + m : m;
                s = (s < 10) ? "0" + s : s;

                var time = h + ":" + m + ":" + s + " " + session;
                document.getElementById("clock").innerText = time;
                document.getElementById("clock").textContent = time;

                setTimeout(showTime, 1000);
            }

            window.onload = () => {
                const bookmarkController = new BookmarkController();
                bookmarkController.index();

                addBookmarkButton.addEventListener(
                    "click", () => {
                        const bookmarkStore = new BookmarkStore();
                        const url = urlInput.value.trim();
                        const bookmark = new Bookmark(null, url, url);
                        const bookmarkView = new BookmarkView();
                        bookmarkView.draw(bookmark);
                        bookmarkStore.create(bookmark);
                    });

                deleteAllButton.addEventListener(
                    "click", () => {
                        bookmarkController.deleteAll();
                    });
                showTime();
            }
        </script>
    </body>
</html>
